<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBANAT // System</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #121212;
    --border: #333333;
    --text: #d4d4d4;
    --muted: #666666;
    --green: #00ff41; /* Терминальный зеленый */
    --red: #ff3333;   /* Дота-красный */
    --font-mono: 'Consolas', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    /* Едва заметная сетка на фоне */
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    line-height: 1.5;
  }

  .wrap {
    max-width: 750px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* Шапка как в терминале */
  .header {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
  }
  /* Имитация кнопок окна ОС */
  .header::before {
    content: "■ □ X";
    position: absolute;
    top: 8px;
    right: 12px;
    color: var(--border);
    font-size: 12px;
    letter-spacing: 4px;
  }
  .header h1 {
    font-size: 24px;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header h1 span {
    color: var(--red);
  }
  .header p {
    color: var(--muted);
    font-size: 14px;
  }
  .cursor {
    display: inline-block;
    width: 10px;
    height: 18px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: bottom;
    margin-left: 5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Вкладки в стиле консольных команд */
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: -1px; /* Соединяем с контентом */
    flex-wrap: wrap;
  }
  .tab-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .tab-btn:hover {
    color: var(--text);
    background: #1a1a1a;
  }
  .tab-btn.active {
    background: var(--panel);
    color: var(--green);
    border-color: var(--border);
    border-bottom-color: var(--panel); /* Сливается с контентом */
    font-weight: bold;
  }

  /* Контентная часть */
  .content-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 30px;
    margin-bottom: 30px;
    min-height: 300px;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Текст "Обо мне" */
  .readme-text p {
    margin-bottom: 16px;
    font-size: 15px;
  }
  .readme-text p::before {
    content: "> ";
    color: var(--green);
    font-weight: bold;
  }
  .keyword { color: var(--red); }
  .string { color: var(--green); }

  /* Форма */
  .form-group { margin-bottom: 20px; }
  label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  input, textarea {
    width: 100%;
    background: #050505;
    border: 1px solid var(--border);
    color: var(--green);
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 15px;
    outline: none;
  }
  input:focus, textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 5px rgba(0, 255, 65, 0.2);
  }
  textarea { min-height: 120px; resize: vertical; }
  
  button[type="submit"] {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 24px;
    font-family: var(--font-mono);
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.1s;
  }
  button[type="submit"]:hover {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  button[type="submit"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: var(--border);
    color: var(--text);
  }

  /* Логи / Список вопросов */
  .log-item {
    border-left: 2px solid var(--border);
    padding-left: 15px;
    margin-bottom: 25px;
    position: relative;
  }
  .log-item::before {
    content: "";
    position: absolute;
    left: -4px;
    top: 5px;
    width: 6px;
    height: 6px;
    background: var(--border);
    border-radius: 50%;
  }
  .log-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .log-q {
    color: var(--text);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .log-a {
    color: var(--green);
    font-size: 15px;
    background: rgba(0, 255, 65, 0.05);
    padding: 10px;
    border: 1px dashed var(--green);
  }
  .log-a::before {
    content: "ОТВЕТ: ";
    font-size: 12px;
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  
  .empty-msg {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
    font-style: italic;
  }

  @media (max-width: 600px) {
    .tabs { gap: 2px; }
    .tab-btn { flex: 1; padding: 10px 5px; font-size: 12px; text-align: center; }
    .content-box { padding: 20px 15px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Шапка -->
  <div class="header">
    <h1>EBANAT <span>// DAVID</span></h1>
    <p>Начинающий разраб / Дота / Роблокс / ДнД <span class="cursor"></span></p>
  </div>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-about', event)">./about_me</button>
    <button class="tab-btn" onclick="switchTab('tab-form', event)">./ask_question</button>
    <button class="tab-btn" onclick="switchTab('tab-answers', event)">./logs</button>
  </div>

  <!-- Контент -->
  <div class="content-box">
    
    <!-- Вкладка 1: Обо мне -->
    <div id="tab-about" class="tab-content active">
      <div class="readme-text">
        <p>Меня зовут <span class="keyword">Давид</span>, я начинающий разраб всякой херни по типу сайтов и программ (с помощью <span class="string">ИИ</span> конечно).</p>
        <p>Играю в <span class="keyword">Доту</span>, <span class="keyword">Роблокс</span>, <span class="keyword">ДнД</span> (это все основные игры).</p>
        <p>Ну и впринципе все, жду вопросов<span class="cursor" style="width: 8px; height: 15px;"></span></p>
      </div>
    </div>

    <!-- Вкладка 2: Форма -->
    <div id="tab-form" class="tab-content">
      <form id="qform">
        <div class="form-group">
          <label>> Введите ваше имя (опционально):</label>
          <input id="qname" type="text" placeholder="Аноним" maxlength="40">
        </div>
        <div class="form-group">
          <label>> Введите текст вопроса:</label>
          <textarea id="qtext" placeholder="Пишите сюда..." maxlength="1000" required></textarea>
        </div>
        <button type="submit" id="submitBtn">[ Отправить ]</button>
      </form>
    </div>

    <!-- Вкладка 3: Логи (Ответы) -->
    <div id="tab-answers" class="tab-content">
      <div id="qlist" class="empty-msg">Инициализация базы данных...</div>
    </div>

  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAfgqtAUHOAVNo900jMZQFI9GObj47bdc",
    authDomain: "voprosi.firebaseapp.com",
    projectId: "voprosi",
    storageBucket: "voprosi.firebasestorage.app",
    messagingSenderId: "855402975294",
    appId: "1:855402975294:web:72953e066532f05242016f",
    measurementId: "G-1B46511489"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- РЕТРО ЗВУКИ (Web Audio API) ---
  let audioCtx;
  
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        // Ретро клик (как на мех. клавиатуре)
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'success') {
        // 8-бит звук успеха (как монетка в Марио)
        osc.type = 'square';
        osc.frequency.setValueAtTime(988, audioCtx.currentTime); // B5
        osc.frequency.setValueAtTime(1319, audioCtx.currentTime + 0.08); // E6
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  // --- ВКЛАДКИ ---
  window.switchTab = function(tabId, event) {
    playSound('click');
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event && event.currentTarget) event.currentTarget.classList.add('active');
    
    if (tabId === 'tab-answers') loadQuestions();
  };

  // --- ОТПРАВКА ---
  document.getElementById('qform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const name = document.getElementById('qname').value.trim();
    const text = document.getElementById('qtext').value.trim();

    if (text.length < 3) return;

    btn.disabled = true;
    btn.textContent = "[ Отправка... ]";

    try {
      await addDoc(collection(db, "questions"), {
        name: name || "Аноним",
        text: text,
        answer: null,
        created_at: serverTimestamp()
      });
      
      document.getElementById('qform').reset();
      playSound('success');
      
      btn.textContent = "[ Успешно! ]";
      btn.style.color = "#000";
      btn.style.background = "var(--green)";
      btn.style.borderColor = "var(--green)";
      
      setTimeout(() => { 
        btn.textContent = "[ Отправить ]"; 
        btn.style.color = "var(--text)";
        btn.style.background = "var(--border)";
        btn.style.borderColor = "var(--border)";
        btn.disabled = false; 
      }, 2500);
      
    } catch (error) {
      console.error("Ошибка: ", error);
      alert("Ошибка отправки.");
      btn.textContent = "[ Отправить ]";
      btn.disabled = false;
    }
  });

  // --- ЗАГРУЗКА ---
  async function loadQuestions() {
    const qlist = document.getElementById('qlist');
    qlist.innerHTML = 'Загрузка данных...';

    try {
      const q = query(collection(db, "questions"), orderBy("created_at", "desc"));
      const querySnapshot = await getDocs(q);
      
      let html = "";
      let count = 0;

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.answer) {
          count++;
          html += `
            <div class="log-item">
              <div class="log-meta">ID: ${doc.id.slice(0,6)} | От: ${escapeHtml(data.name)}</div>
              <div class="log-q">${escapeHtml(data.text)}</div>
              <div class="log-a">${escapeHtml(data.answer)}</div>
            </div>
          `;
        }
      });

      if (count === 0) {
        qlist.innerHTML = '<div class="empty-msg">// Записей в логах не найдено.</div>';
      } else {
        qlist.innerHTML = html;
        qlist.classList.remove('empty-msg');
      }
    } catch (error) {
      console.error("Ошибка загрузки: ", error);
      qlist.innerHTML = '<div class="empty-msg">// Ошибка чтения базы данных.</div>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadQuestions();
</script>
</body>
</html>
