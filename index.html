<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Давид (EBANAT) — Задать вопрос</title>
<style>
  :root{
    --bg: #08090d;
    --surface: rgba(255, 255, 255, 0.03);
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #f0f2f8;
    --muted: #8b93a7;
    --accent: #8b5cf6;
    --accent2: #06b6d4;
    --accent-glow: rgba(139, 92, 246, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Фоновые пятна */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    animation: float 20s ease-in-out infinite alternate;
  }
  .blob.a { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -200px; }
  .blob.b { width: 500px; height: 500px; background: var(--accent2); bottom: -200px; right: -200px; animation-delay: -10s; }
  
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(100px, 50px) scale(1.1); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 60px 20px 80px;
  }

  /* Шапка */
  .hero {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 40px;
    animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid;
    place-items: center;
    font-size: 36px;
    font-weight: 800;
    box-shadow: 0 20px 40px -15px var(--accent-glow);
    border: 2px solid rgba(255,255,255,0.1);
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.1;
    letter-spacing: -1px;
    font-weight: 800;
  }
  h1 span {
    background: linear-gradient(100deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: rgba(255,255,255,0.1);
    padding: 4px 10px;
    border-radius: 8px;
    vertical-align: middle;
    margin-left: 10px;
    color: var(--accent2);
  }

  /* Вкладки */
  .tabs-container {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 20px;
    padding: 6px;
    margin-bottom: 24px;
    position: relative;
    backdrop-filter: blur(10px);
    animation: slideDown 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
  }
  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: #fff;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  /* Контент вкладок */
  .tab-content {
    display: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .tab-content.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  /* Карточки */
  .card {
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 24px;
    padding: 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  /* Форма */
  .field { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    padding: 16px;
    outline: none;
    transition: all 0.3s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    background: rgba(0,0,0,0.5);
  }
  textarea { min-height: 130px; resize: vertical; }
  
  button[type="submit"] {
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    cursor: pointer;
    border: none;
    border-radius: 16px;
    padding: 16px;
    background: linear-gradient(100deg, var(--accent), #6366f1);
    box-shadow: 0 10px 25px -5px var(--accent-glow);
    transition: all 0.2s ease;
  }
  button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px -5px var(--accent-glow);
  }
  button[type="submit"]:active { transform: translateY(0); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Список вопросов */
  .qitem {
    padding: 20px 0;
    border-bottom: 1px solid var(--stroke);
    animation: fadeIn 0.5s ease both;
  }
  .qitem:last-child { border-bottom: none; padding-bottom: 0; }
  .qitem:first-child { padding-top: 0; }
  
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .qname {
    font-weight: 700;
    font-size: 15px;
    color: #fff;
  }
  .qtext {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .qanswer {
    margin-top: 16px;
    padding: 16px;
    background: rgba(139, 92, 246, 0.08);
    border-left: 3px solid var(--accent);
    border-radius: 0 12px 12px 0;
    font-size: 15px;
    color: #e2e8f0;
  }
  .qanswer strong {
    display: block;
    color: var(--accent2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 15px;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .hero { flex-direction: column; text-align: center; gap: 16px; }
    .card { padding: 24px 20px; }
    .badge { display: block; margin: 8px auto 0; width: fit-content; }
  }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<div class="wrap">
  <header class="hero">
    <div class="avatar">Д</div>
    <div>
      <h1>Давид <span>(EBANAT)</span></h1>
      <div style="color: var(--muted); font-size: 16px; margin-top: 4px;">Отвечаю на ваши вопросы</div>
    </div>
  </header>

  <!-- Вкладки -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('tab-form')">Задать вопрос</button>
    <button class="tab-btn" onclick="switchTab('tab-answers')">Заданные вопросы</button>
  </div>

  <!-- Вкладка 1: Форма -->
  <div id="tab-form" class="tab-content active">
    <div class="card">
      <form id="qform">
        <div class="field">
          <label for="qname">Как вас зовут? (необязательно)</label>
          <input id="qname" type="text" placeholder="Аноним" maxlength="40">
        </div>
        <div class="field">
          <label for="qtext">Ваш вопрос</label>
          <textarea id="qtext" placeholder="Спрашивайте что угодно..." maxlength="1000" required></textarea>
        </div>
        <button type="submit" id="submitBtn">Отправить вопрос</button>
      </form>
    </div>
  </div>

  <!-- Вкладка 2: Ответы -->
  <div id="tab-answers" class="tab-content">
    <div class="card">
      <div id="qlist" class="empty">Загрузка...</div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Ключи Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAAfgqtAUHOAVNo900jMZQFI9GObj47bdc",
    authDomain: "voprosi.firebaseapp.com",
    projectId: "voprosi",
    storageBucket: "voprosi.firebasestorage.app",
    messagingSenderId: "855402975294",
    appId: "1:855402975294:web:72953e066532f05242016f",
    measurementId: "G-1B46511489"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- ЛОГИКА ВКЛАДОК ---
  window.switchTab = function(tabId) {
    // Скрываем все контенты
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    // Убираем активный класс со всех кнопок
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    // Показываем нужный контент
    document.getElementById(tabId).classList.add('active');
    
    // Добавляем класс кнопке, по которой кликнули
    event.currentTarget.classList.add('active');
    
    // Если переключились на ответы — обновляем список
    if (tabId === 'tab-answers') {
      loadQuestions();
    }
  };

  // --- ОТПРАВКА ВОПРОСА ---
  document.getElementById('qform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const name = document.getElementById('qname').value.trim();
    const text = document.getElementById('qtext').value.trim();

    if (text.length < 3) return;

    btn.disabled = true;
    btn.textContent = "Отправка...";

    try {
      await addDoc(collection(db, "questions"), {
        name: name || "Аноним",
        text: text,
        answer: null,
        created_at: serverTimestamp()
      });
      
      document.getElementById('qform').reset();
      btn.textContent = "Успешно отправлено ✓";
      btn.style.background = "linear-gradient(100deg, #10b981, #059669)";
      
      setTimeout(() => { 
        btn.textContent = "Отправить вопрос"; 
        btn.style.background = "linear-gradient(100deg, var(--accent), #6366f1)";
        btn.disabled = false; 
      }, 3000);
      
    } catch (error) {
      console.error("Ошибка: ", error);
      alert("Ошибка отправки. Попробуйте позже.");
      btn.textContent = "Отправить вопрос";
      btn.disabled = false;
    }
  });

  // --- ЗАГРУЗКА ОТВЕТОВ ---
  async function loadQuestions() {
    const qlist = document.getElementById('qlist');
    // Показываем скелетон загрузки, если список пуст
    if(qlist.innerHTML === 'Загрузка...' || qlist.innerHTML === '') {
       qlist.innerHTML = '<div class="empty">Загрузка...</div>';
    }

    try {
      const q = query(collection(db, "questions"), orderBy("created_at", "desc"));
      const querySnapshot = await getDocs(q);
      
      let html = "";
      let count = 0;

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.answer) { // Показываем только те, где есть ответ
          count++;
          html += `
            <div class="qitem">
              <div class="qhead">
                <span class="qname">${escapeHtml(data.name)}</span>
              </div>
              <div class="qtext">${escapeHtml(data.text)}</div>
              <div class="qanswer">
                <strong>Ответ:</strong> 
                ${escapeHtml(data.answer)}
              </div>
            </div>
          `;
        }
      });

      if (count === 0) {
        qlist.innerHTML = '<div class="empty">Пока нет отвеченных вопросов. Станьте первым!</div>';
      } else {
        qlist.innerHTML = html;
        qlist.classList.remove('empty');
      }
    } catch (error) {
      console.error("Ошибка загрузки: ", error);
      qlist.innerHTML = '<div class="empty">Не удалось загрузить вопросы.</div>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Инициализация при загрузке страницы
  loadQuestions();

</script>
</body>
</html>
