<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBANAT // System</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #121212;
    --border: #333333;
    --text: #d4d4d4;
    --muted: #666666;
    --green: #00ff41;
    --red: #ff3333;
    --font-mono: 'Consolas', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Кастомный скроллбар */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--border); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--green); }

  body {
    background-color: var(--bg);
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* --- СТИЛИ ДЛЯ ПАДАЮЩИХ ОКОН (ХАКЕР) --- */
  .matrix-window {
    position: fixed;
    top: -300px;
    z-index: 0;
    pointer-events: none;
    background: #0a0a0a;
    border: 1px solid rgba(0, 255, 65, 0.3);
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--green);
    opacity: 0;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    overflow: hidden;
  }

  .matrix-header {
    border-bottom: 1px solid rgba(0, 255, 65, 0.2);
    color: rgba(0, 255, 65, 0.5);
    font-size: 9px;
    margin-bottom: 6px;
    padding-bottom: 3px;
    letter-spacing: 2px;
    display: flex;
    justify-content: flex-end;
  }

  .matrix-content {
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.3;
    text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
    max-height: 250px;
    display: block;
  }

  .matrix-cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: var(--green);
    vertical-align: middle;
    margin-left: 2px;
    animation: blink-matrix 0.8s step-end infinite;
  }

  @keyframes blink-matrix { 50% { opacity: 0; } }

  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(120vh); opacity: 0; }
  }

  /* --- ОСНОВНОЙ КОНТЕНТ --- */
  .wrap {
    position: relative;
    z-index: 10;
    max-width: 750px;
    margin: 0 auto;
    padding: 40px 20px;
    flex: 1;
    width: 100%;
  }

  /* Шапка */
  .header {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header::before {
    content: "■ □ X";
    position: absolute;
    top: 8px;
    right: 12px;
    color: var(--border);
    font-size: 12px;
    letter-spacing: 4px;
  }
  .header-info h1 {
    font-size: 24px;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header-info h1 span { color: var(--red); }
  .header-info p { color: var(--muted); font-size: 14px; }
  
  .sound-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
  }
  .sound-toggle:hover { border-color: var(--green); color: var(--green); }
  .sound-toggle.active { color: var(--green); border-color: var(--green); }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 18px;
    background: var(--green);
    animation: blink 1s step-end infinite;
    vertical-align: bottom;
    margin-left: 5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Вкладки */
  .tabs { display: flex; gap: 5px; margin-bottom: -1px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 16px;
    font-family: var(--font-mono);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .tab-btn:hover { color: var(--text); background: #1a1a1a; }
  .tab-btn.active {
    background: var(--panel);
    color: var(--green);
    border-bottom-color: var(--panel);
    font-weight: bold;
  }

  /* Контентная часть */
  .content-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 30px;
    margin-bottom: 30px;
    min-height: 300px;
    position: relative;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Текст "Обо мне" */
  .readme-text p { margin-bottom: 16px; font-size: 15px; }
  .readme-text p::before { content: "> "; color: var(--green); font-weight: bold; }
  .keyword { color: var(--red); }
  .string { color: var(--green); }

  .fade-line {
    opacity: 0;
    animation: fadeInLine 0.4s ease forwards;
  }
  @keyframes fadeInLine {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Форма */
  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
  input, textarea {
    width: 100%;
    background: #050505;
    border: 1px solid var(--border);
    color: var(--green);
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 15px;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 5px rgba(0, 255, 65, 0.2); }
  textarea { min-height: 120px; resize: vertical; }
  
  button[type="submit"] {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 24px;
    font-family: var(--font-mono);
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.1s;
  }
  button[type="submit"]:hover { background: var(--green); color: #000; border-color: var(--green); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; background: var(--border); color: var(--text); }

  /* Логи */
  .log-item { border-left: 2px solid var(--border); padding-left: 15px; margin-bottom: 25px; position: relative; }
  .log-item::before {
    content: ""; position: absolute; left: -4px; top: 5px; width: 6px; height: 6px; background: var(--border); border-radius: 50%;
  }
  .log-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
  .log-q { color: var(--text); font-size: 15px; margin-bottom: 10px; }
  .log-a {
    color: var(--green); font-size: 15px; background: rgba(0, 255, 65, 0.05); padding: 10px; border: 1px dashed var(--green);
  }
  .log-a::before { content: "ОТВЕТ: "; font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; opacity: 0.7; }
  
  .empty-msg { color: var(--muted); text-align: center; padding: 40px 0; font-style: italic; }

  /* Статус-бар */
  .status-bar {
    background: #111;
    border-top: 1px solid var(--border);
    padding: 5px 15px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 10;
  }
  .status-bar span { margin-right: 15px; }
  .status-bar .green { color: var(--green); }
  
  .spinner { color: var(--green); font-weight: bold; margin-right: 5px; }

  @media (max-width: 600px) {
    .tabs { gap: 2px; }
    .tab-btn { flex: 1; padding: 10px 5px; font-size: 12px; text-align: center; }
    .content-box { padding: 20px 15px; }
    .header { flex-direction: column; }
    .sound-toggle { margin-top: 15px; align-self: flex-start; }
    .status-bar { flex-direction: column; align-items: flex-start; gap: 5px; padding: 10px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-info">
      <h1>EBANAT <span>// DAVID</span></h1>
      <p>Начинающий разраб / Дота / Роблокс / DDNet <span class="cursor"></span></p>
    </div>
    <button class="sound-toggle active" id="soundBtn" onclick="toggleSound()">[ ЗВУК: ВКЛ ]</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tab-about', event)">./about_me</button>
    <button class="tab-btn" onclick="switchTab('tab-form', event)">./ask_question</button>
    <button class="tab-btn" onclick="switchTab('tab-answers', event)">./logs</button>
  </div>

  <div class="content-box">
    <div id="tab-about" class="tab-content active">
      <div class="readme-text" id="typewriter-container"></div>
    </div>

    <div id="tab-form" class="tab-content">
      <form id="qform">
        <div class="form-group">
          <label>> Введите ваше имя (опционально):</label>
          <input id="qname" type="text" placeholder="Аноним" maxlength="40">
        </div>
        <div class="form-group">
          <label>> Введите текст вопроса:</label>
          <textarea id="qtext" placeholder="Пишите сюда..." maxlength="1000" required></textarea>
        </div>
        <button type="submit" id="submitBtn">[ Отправить ]</button>
      </form>
    </div>

    <div id="tab-answers" class="tab-content">
      <div id="qlist" class="empty-msg">Инициализация базы данных...</div>
    </div>
  </div>
</div>

<div class="status-bar">
  <div>
    <span class="green">● Система онлайн</span>
    <span>UTF-8</span>
    <span>JavaScript</span>
  </div>
  <div>
    <span>Firebase: Connected</span>
    <span>v1.0.6 (Hacker Mode)</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAfgqtAUHOAVNo900jMZQFI9GObj47bdc",
    authDomain: "voprosi.firebaseapp.com",
    projectId: "voprosi",
    storageBucket: "voprosi.firebasestorage.app",
    messagingSenderId: "855402975294",
    appId: "1:855402975294:web:72953e066532f05242016f",
    measurementId: "G-1B46511489"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ==========================================
  // ГЕНЕРАТОР ПАДАЮЩИХ ОКОН (ХАКЕР ТАЙПИНГ)
  // ==========================================
  function createMatrixWindow() {
    const win = document.createElement('div');
    win.className = 'matrix-window';
    
    const width = Math.random() * 80 + 80; // Ширина окна от 80 до 160px
    win.style.width = width + 'px';
    win.style.left = (Math.random() * 85 + 5) + 'vw'; // Позиция по X
    win.style.animationDuration = (Math.random() * 6 + 8) + 's'; // Падает 8-14 секунд

    win.innerHTML = `
      <div class="matrix-header">■ □ X</div>
      <div class="matrix-content"><span class="typing-text"></span><span class="matrix-cursor"></span></div>
    `;

    document.body.appendChild(win);

    const textEl = win.querySelector('.typing-text');
    let currentText = "";
    let isTyping = true;
    let charCount = 0;
    const maxChars = 150; // Ограничение, чтобы окно не растянулось

    // Паттерны для "хакерского" ввода
    const patterns = [
      () => Math.random() > 0.5 ? '1' : '0', // Бинарный
      () => Math.random() > 0.5 ? '1' : '0', 
      () => {
        const hex = Math.floor(Math.random() * 255).toString(16).toUpperCase();
        return hex.padStart(2, '0') + ' '; // Hex (0xAF)
      },
      () => {
        const cmds = ['sudo ', 'root@', 'ping ', '> ', '$ ', 'src=', 'exec '];
        return cmds[Math.floor(Math.random() * cmds.length)]; // Команды
      },
      () => {
        const syms = ['$', '#', '@', '%', '_', '!', '?', '*'];
        return syms[Math.floor(Math.random() * syms.length)]; // Спецсимволы
      }
    ];

    function type() {
      if (!isTyping || !win.isConnected) return;

      // Иногда имитируем "залипание" или раздумье (пауза)
      const delay = Math.random() > 0.95 ? 400 : Math.random() * 80 + 20;

      if (charCount < maxChars) {
        // 5% шанс на Backspace (ошибся и стер)
        if (Math.random() < 0.05 && currentText.length > 0) {
          currentText = currentText.slice(0, -1);
        } 
        // 10% шанс на перенос строки (Enter)
        else if (Math.random() < 0.1) {
          currentText += "\n";
        } 
        // Обычный ввод символа
        else {
          const patternFn = patterns[Math.floor(Math.random() * patterns.length)];
          currentText += patternFn();
          charCount++;
        }

        textEl.textContent = currentText;
        
        // Прокрутка вниз, если текст вылез за пределы
        if (win.querySelector('.matrix-content').scrollHeight > 250) {
           win.querySelector('.matrix-content').scrollTop = win.querySelector('.matrix-content').scrollHeight;
        }
      }

      // Рекурсивный вызов с случайной задержкой
      setTimeout(type, delay);
    }

    // Запускаем печать с небольшой задержкой после появления
    setTimeout(type, 300);

    // Удаляем окно, когда оно улетает вниз
    setTimeout(() => {
      isTyping = false;
      win.remove();
    }, (parseFloat(win.style.animationDuration) * 1000) + 500);
  }

  // Спавним окна
  setInterval(() => {
    if (Math.random() > 0.2) {
      createMatrixWindow();
    }
  }, 2000);

  // ==========================================
  // ЗВУКИ
  // ==========================================
  let isSoundEnabled = true;
  let audioCtx;

  window.toggleSound = function() {
    isSoundEnabled = !isSoundEnabled;
    const btn = document.getElementById('soundBtn');
    if(isSoundEnabled) {
      btn.textContent = "[ ЗВУК: ВКЛ ]";
      btn.classList.add('active');
      playSound('click');
    } else {
      btn.textContent = "[ ЗВУК: ВЫКЛ ]";
      btn.classList.remove('active');
    }
  };

  function playSound(type) {
    if (!isSoundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'success') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(988, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1319, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch(e) {}
  }

  // ==========================================
  // ЭФФЕКТ ПЕЧАТНОЙ МАШИНКИ (Обо мне)
  // ==========================================
  const textData = [
    'Меня зовут <span class="keyword">Давид</span>, я начинающий разраб всякой херни по типу сайтов и программ (с помощью <span class="string">ИИ</span> конечно).',
    'Играю в <span class="keyword">Доту</span>, <span class="keyword">Роблокс</span>, <span class="keyword">ДДНЕТ</span> (это все основные игры).',
    'Ну и впринципе все, жду вопросов<span class="cursor" style="width: 8px; height: 15px; display:inline-block; vertical-align:bottom; margin-left:2px;"></span>'
  ];

  function typeWriter() {
    const container = document.getElementById('typewriter-container');
    container.innerHTML = '';
    let lineIndex = 0;

    function typeLine() {
      if (lineIndex >= textData.length) return;
      
      const p = document.createElement('p');
      p.innerHTML = textData[lineIndex];
      p.classList.add('fade-line'); 
      container.appendChild(p);
      
      lineIndex++;
      setTimeout(typeLine, 600);
    }
    
    setTimeout(typeLine, 300);
  }

  // ==========================================
  // ЛОГИКА ВКЛАДОК И БАЗЫ ДАННЫХ
  // ==========================================
  window.switchTab = function(tabId, event) {
    playSound('click');
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event && event.currentTarget) event.currentTarget.classList.add('active');
    
    if (tabId === 'tab-answers') loadQuestions();
  };

  document.getElementById('qform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const name = document.getElementById('qname').value.trim();
    const text = document.getElementById('qtext').value.trim();

    if (text.length < 3) return;

    btn.disabled = true;
    btn.textContent = "[ Отправка... ]";

    try {
      await addDoc(collection(db, "questions"), {
        name: name || "Аноним",
        text: text,
        answer: null,
        created_at: serverTimestamp()
      });
      
      document.getElementById('qform').reset();
      playSound('success');
      
      btn.textContent = "[ Успешно! ]";
      btn.style.color = "#000";
      btn.style.background = "var(--green)";
      btn.style.borderColor = "var(--green)";
      
      setTimeout(() => { 
        btn.textContent = "[ Отправить ]"; 
        btn.style.color = "var(--text)";
        btn.style.background = "var(--border)";
        btn.style.borderColor = "var(--border)";
        btn.disabled = false; 
      }, 2500);
      
    } catch (error) {
      console.error("Ошибка: ", error);
      alert("Ошибка отправки.");
      btn.textContent = "[ Отправить ]";
      btn.disabled = false;
    }
  });

  let spinInterval;
  async function loadQuestions() {
    const qlist = document.getElementById('qlist');
    const spinnerChars = ['|', '/', '-', '\\'];
    let spinIndex = 0;
    
    qlist.innerHTML = `<span class="spinner">${spinnerChars[0]}</span> Чтение базы данных...`;
    
    clearInterval(spinInterval);
    spinInterval = setInterval(() => {
      spinIndex = (spinIndex + 1) % spinnerChars.length;
      const spinnerEl = qlist.querySelector('.spinner');
      if (spinnerEl) spinnerEl.textContent = spinnerChars[spinIndex];
    }, 150);

    try {
      const q = query(collection(db, "questions"), orderBy("created_at", "desc"));
      const querySnapshot = await getDocs(q);
      
      let html = "";
      let count = 0;

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.answer) {
          count++;
          html += `
            <div class="log-item">
              <div class="log-meta">ID: ${doc.id.slice(0,6)} | От: ${escapeHtml(data.name)}</div>
              <div class="log-q">${escapeHtml(data.text)}</div>
              <div class="log-a">${escapeHtml(data.answer)}</div>
            </div>
          `;
        }
      });

      clearInterval(spinInterval);

      if (count === 0) {
        qlist.innerHTML = '<div class="empty-msg">// Записей в логах не найдено.</div>';
      } else {
        qlist.innerHTML = html;
        qlist.classList.remove('empty-msg');
      }
    } catch (error) {
      clearInterval(spinInterval);
      console.error("Ошибка загрузки: ", error);
      qlist.innerHTML = '<div class="empty-msg">// Ошибка чтения базы данных.</div>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  typeWriter();
  loadQuestions();
</script>
</body>
</html>
