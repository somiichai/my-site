<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Вопросы</title>
<style>
  body{font-family:sans-serif;background:#0b0d12;color:#e8ebf2;padding:2rem;max-width:800px;margin:0 auto}
  h1{margin-bottom:1.5rem;font-size:24px}
  .q-card{background:#151925;border:1px solid #2a2f3d;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
  .q-text{font-size:16px;margin-bottom:8px;color:#fff;white-space:pre-wrap}
  .q-meta{font-size:13px;color:#8b93a7;margin-bottom:16px}
  textarea{width:100%;min-height:90px;background:#0b0d12;color:#fff;border:1px solid #2a2f3d;border-radius:8px;padding:12px;font-family:inherit;font-size:15px;margin-bottom:10px;box-sizing:border-box}
  button{background:#7c5cff;color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-weight:bold}
  button:hover{background:#6a4df0}
  .answered{background:rgba(34,211,238,.1);border-left:3px solid #22d3ee;padding:12px;border-radius:4px;margin-top:12px;white-space:pre-wrap}
  .refresh-btn{background:#2a2f3d;margin-bottom:20px;display:inline-block}
</style>
</head>
<body>
  <h1>Все вопросы (Админка)</h1>
  <button class="refresh-btn" onclick="loadAll()">Обновить список</button>
  <div id="list">Загрузка...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAfgqtAUHOAVNo900jMZQFI9GObj47bdc",
      authDomain: "voprosi.firebaseapp.com",
      projectId: "voprosi",
      storageBucket: "voprosi.firebasestorage.app",
      messagingSenderId: "855402975294",
      appId: "1:855402975294:web:72953e066532f05242016f",
      measurementId: "G-1B46511489"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAll() {
      const list = document.getElementById('list');
      list.innerHTML = "Загрузка...";
      
      try {
        const q = query(collection(db, "questions"), orderBy("created_at", "desc"));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          list.innerHTML = "<p>Вопросов пока нет.</p>";
          return;
        }

        let html = "";
        snap.forEach((document) => {
          const data = document.data();
          const id = document.id;
          
          html += `
            <div class="q-card">
              <div class="q-text">${escapeHtml(data.text)}</div>
              <div class="q-meta">От: ${escapeHtml(data.name)}</div>
              ${data.answer 
                ? `<div class="answered"><strong>Ответ:</strong> ${escapeHtml(data.answer)}</div>`
                : `<textarea id="ans-${id}" placeholder="Напишите ответ..."></textarea>
                   <button onclick="saveAns('${id}')">Сохранить ответ</button>`
              }
            </div>
          `;
        });
        list.innerHTML = html;
      } catch (e) {
        console.error(e);
        list.innerHTML = "<p>Ошибка загрузки данных. Проверьте правила доступа в Firestore.</p>";
      }
    }

    window.saveAns = async function(id) {
      const textarea = document.getElementById(`ans-${id}`);
      const answerText = textarea.value.trim();
      if (!answerText) return alert("Напишите ответ!");

      try {
        const qRef = doc(db, "questions", id);
        await updateDoc(qRef, { answer: answerText });
        alert("Ответ сохранен! Он сразу появится на главной странице.");
        loadAll();
      } catch (e) {
        console.error(e);
        alert("Ошибка при сохранении.");
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadAll();
  </script>
</body>
</html>
